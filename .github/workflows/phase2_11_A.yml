name: Phase 2-11-A Hom Sym2 to E

on:
  push:
    paths:
      - 'research/phase2_11_A_Hom_Sym2_to_E_2026-09-15.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'
      - '.github/workflows/phase2_11_A.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Run Phase 2-11-A
        run: python research/phase2_11_A_Hom_Sym2_to_E_2026-09-15.py
