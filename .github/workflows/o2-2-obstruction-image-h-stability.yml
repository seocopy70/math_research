name: O2-2 Obstruction Image H-Stability

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Run O2-2 H-stability test
        run: python research/O2-2_OBSTRUCTION_IMAGE_H_STABILITY_2026-09-18.py
