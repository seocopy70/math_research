name: A3-4-12.5b ambient I vs K

on:
  push:
    paths:
      - 'research/A3-4-12_5b_AMBIENT_I_EQUALS_K_CHECK_2026-09-16.py'
      - 'research/phase2_18_A3-4-5_intersection_K_and_Sym2_2026-09-16.py'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy
      - name: Run A3-4-12.5b ambient I vs K check
        run: python research/A3-4-12_5b_AMBIENT_I_EQUALS_K_CHECK_2026-09-16.py
