name: Phase 2-12 E vs Sym4(V)

on:
  push:
    paths:
      - 'research/phase2_12_E_vs_Sym4V_2026-09-15.py'
      - 'research/PHASE2_12_TRIGGER_2026-09-15.md'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'
      - '.github/workflows/phase2_12.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Run Phase 2-12
        run: python research/phase2_12_E_vs_Sym4V_2026-09-15.py
