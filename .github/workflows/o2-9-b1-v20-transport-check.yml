name: O2-9 B1 V20 transport check

on:
  push:
    paths:
      - "research/O2_9_B1_V20_transport_check_2026-09-18.py"
      - "research/O2_9_full_transport_invariance_2026-09-18.py"
      - "research/O2_8_factor_through_N_2026-09-18.py"
      - "research/A3-4-10_CANONICAL_TAU_REVALIDATION_2026-09-16.py"
      - "research/phase2_3_endH_optimized_2026-09-15.py"
      - ".github/workflows/o2-9-b1-v20-transport-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - run: python research/O2_9_B1_V20_transport_check_2026-09-18.py
