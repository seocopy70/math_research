name: paper4-tex-build
on:
  push:
    branches:
      - paper4-tex-2026-10-04
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Paper 4
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper4/main.tex
          working_directory: .
      - name: Audit PDF
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          p=Path('main.pdf')
          r=PdfReader(str(p))
          print(f'Pages: {len(r.pages)}')
          text='\n'.join((page.extract_text() or '') for page in r.pages)
          Path('main.txt').write_text(text, encoding='utf-8')
          assert len(r.pages) > 0
          assert 'Delayed Finite-Window Visibility' in text
          assert 'Zassenhaus order alone is insufficient' in text
          assert 'Intrinsic critical-window separation' in text
          assert 'sharpness theorem' in text
          assert 'uniformly optimal for every' in text
          assert 'n' in text and 'sep' in text and 'p' in text
          assert 'References' in text
          assert 'Seo Seongkyo' in text
          assert 'direct order jump' not in text
          assert 'order-jump separation' not in text
          Path('pdfinfo.txt').write_text(f'Pages: {len(r.pages)}\nSize: {p.stat().st_size}\n', encoding='utf-8')
          PY
          sha256sum main.pdf | tee main.pdf.sha256
          sha256sum paper4/main.tex | tee main.tex.sha256
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "source_blob_sha=$(git hash-object paper4/main.tex)"
            echo "source_sha256=$(cut -d' ' -f1 main.tex.sha256)"
            echo "pdf_sha256=$(cut -d' ' -f1 main.pdf.sha256)"
            cat pdfinfo.txt
          } > publication-manifest.txt
          test -s main.pdf
          test -s main.txt
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper4-pdf
          path: |
            main.pdf
            main.pdf.sha256
            pdfinfo.txt
            publication-manifest.txt
            main.tex.sha256
