name: paper4-tex-build
on:
  push:
    branches:
      - paper4-tex-2026-10-04
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Paper 4
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper4/main.tex
          working_directory: .
      - name: Audit PDF
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          p=Path('main.pdf')
          r=PdfReader(str(p))
          print(f'Pages: {len(r.pages)}')
          text='\n'.join((page.extract_text() or '') for page in r.pages)
          Path('main.txt').write_text(text, encoding='utf-8')
          assert len(r.pages) > 0
          assert 'Delayed Finite-Window Visibility' in text
          assert 'Zassenhaus order alone is insufficient' in text
          assert 'Intrinsic critical-window separation' in text
          assert 'Every-$n$ sharpness in the free pro-$p$ class' in text
          assert 'best possible in the free-pro-$p$ class' in text
          assert 'n_{\\mathrm{sep}}(s)=p^s+1' in text
          Path('pdfinfo.txt').write_text(f'Pages: {len(r.pages)}\nSize: {p.stat().st_size}\n', encoding='utf-8')
          PY
          sha256sum main.pdf | tee main.pdf.sha256
          test -s main.pdf
          test -s main.txt
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper4-pdf
          path: |
            main.pdf
            main.pdf.sha256
            pdfinfo.txt
