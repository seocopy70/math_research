name: paper4-tex-build
on:
  push:
    branches:
      - paper4-tex-2026-10-04
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Paper 4
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper4/main.tex
          working_directory: .
      - name: Audit PDF
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          p=Path('paper4/main.pdf')
          r=PdfReader(str(p))
          print(f'Pages: {len(r.pages)}')
          text='\n'.join((page.extract_text() or '') for page in r.pages)
          Path('paper4/main.txt').write_text(text, encoding='utf-8')
          assert len(r.pages) > 0
          assert 'Delayed Finite-Window Visibility' in text
          assert 'Zassenhaus order alone is insufficient' in text
          assert 'Intrinsic critical-window separation' in text
          assert 'sharpness theorem' in text
          assert 'uniformly optimal for every' in text
          assert 'n' in text and 'sep' in text and 'p' in text
          assert 'References' in text
          assert '?' not in text
          Path('paper4/pdfinfo.txt').write_text(f'Pages: {len(r.pages)}\nSize: {p.stat().st_size}\n', encoding='utf-8')
          PY
          sha256sum paper4/main.pdf | tee paper4/main.pdf.sha256
          test -s paper4/main.pdf
          test -s paper4/main.txt
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper4-pdf
          path: |
            paper4/main.pdf
            paper4/main.pdf.sha256
            paper4/pdfinfo.txt
