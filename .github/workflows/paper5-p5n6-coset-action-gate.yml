name: Paper 5 p=5 n=6 coset action stabilizer gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/scripts/paper5_p5n6_coset_action_gate.g'
      - '.github/workflows/paper5-p5n6-coset-action-gate.yml'
jobs:
  coset-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GAP and AutPGrp
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gap gap-autpgrp
      - name: Run coset action gate
        run: |
          set -euo pipefail
          gap -q research/scripts/paper5_p5n6_coset_action_gate.g > paper5_p5n6_coset_runtime.log 2>&1
          cat paper5_p5n6_coset_runtime.log
          grep -Fq 'P5_COSET_STABILIZER s=0 a=1 PASS' paper5_p5n6_coset_runtime.log
          grep -Fq 'P5_COSET_STABILIZER s=1 a=1 PASS' paper5_p5n6_coset_runtime.log
          grep -Fq 'P5_COSET_STABILIZER_CERTIFICATE=PASS' paper5_p5n6_coset_runtime.log
