name: A3-4-11 obstruction module analysis

on:
  push:
    paths:
      - 'research/A3-4-11_OBSTRUCTION_MODULE_2026-09-16.py'
      - 'research/A3-4-11_TRUE_R5_INTERSECTION_2026-09-16.py'
      - 'research/phase2_23_A3_4_10_ambient_bracket_compatibility_2026-09-16.py'
      - 'research/phase2_18_A3-4-5_intersection_K_and_Sym2_2026-09-16.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - '.github/workflows/a3-4-11-obstruction-module.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Run obstruction module analysis
        run: python research/A3-4-11_OBSTRUCTION_MODULE_2026-09-16.py
