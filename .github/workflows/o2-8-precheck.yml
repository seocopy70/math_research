name: O2-8 precheck specialness of 9D shadow
# O2-8 rerun after complete H-orbit-closure audit

on:
  push:
    paths:
      - 'research/O2_8_precheck_specialness_2026-09-18.py'
      - 'research/O2-8_PRECHECK_DESIGN_2026-09-18.md'
      - '.github/workflows/o2-8-precheck.yml'
  workflow_dispatch:

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Run O2-8 precheck
        run: python research/O2_8_precheck_specialness_2026-09-18.py
