name: Q3-2A Projective U Orbit Census

on:
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run projective U orbit census
        run: python research/Q3_2A_projective_U_orbit_census_2026-09-18.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: q3-2a-projective-u-orbit-census
          path: research/artifacts/q3_2a_projective_U_orbit_census.json
