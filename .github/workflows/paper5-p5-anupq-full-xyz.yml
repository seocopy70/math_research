name: Paper 5 ANUPQ capability and full XYZ solver

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/scripts/paper5_p5_full_xyz_lift_solver.g'
      - 'research/scripts/paper5_p5_anupq_capability.g'
      - '.github/workflows/paper5-p5-anupq-full-xyz.yml'

jobs:
  anupq-and-solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GAP and build ANUPQ
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gap gap-autpgrp git build-essential
          mkdir -p "$HOME/gap-pkg"
          git clone --depth 1 https://github.com/gap-packages/anupq.git "$HOME/gap-pkg/anupq"
          cd "$HOME/gap-pkg/anupq"
          if [ -f Makefile ]; then make; fi
          echo "GAP_ROOT=$HOME/gap-pkg" >> "$GITHUB_ENV"
          echo "GAP_PACKAGE_PATH=$HOME/gap-pkg" >> "$GITHUB_ENV"

      - name: ANUPQ capability gate
        shell: bash
        run: |
          set -euo pipefail
          gap -q research/scripts/paper5_p5_anupq_capability.g 2>&1 | tee anupq-capability.log
          grep -Fq 'ANUPQ_CAPABILITY=PASS' anupq-capability.log
          grep -Fq 'ANUPQ_PQUOTIENT_N7=PASS' anupq-capability.log
          grep -Fq 'ANUPQ_PQUOTIENT_N8=PASS' anupq-capability.log

      - name: Full XYZ lift solver
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f research/scripts/paper5_p5_full_xyz_lift_solver.g
          gap -q research/scripts/paper5_p5_full_xyz_lift_solver.g 2>&1 | tee full-xyz-lift.log
          grep -Fq 'FULL_XYZ_SOLVER=' full-xyz-lift.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper5-p5-anupq-full-xyz-logs
          path: |
            anupq-capability.log
            full-xyz-lift.log
          if-no-files-found: ignore
