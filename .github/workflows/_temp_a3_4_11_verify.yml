name: TEMP A3-4-11 verify
on:
  push:
    paths:
      - 'research/phase2_24_A3_4_11_L5_obstruction_compression_2026-09-16.py'
      - 'research/phase2_23_A3_4_10_ambient_bracket_compatibility_2026-09-16.py'
      - 'research/phase2_18_A3_4_5_intersection_K_and_Sym2_2026-09-16.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - '.github/workflows/_temp_a3_4_11_verify.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/phase2_24_A3_4_11_L5_obstruction_compression_2026-09-16.py
