name: Paper5 p5n6 matrix convention diagnostic
on:
  push:
    paths:
      - 'research/scripts/paper5_gl_stabilizer_p5n6_matrix_diag.g'
      - '.github/workflows/paper5-gl-stabilizer-p5n6-matrix-diag.yml'
jobs:
  gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GAP and AutPGrp
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-autpgrp
      - name: Run matrix diagnostic
        run: |
          set -euo pipefail
          gap -q research/scripts/paper5_gl_stabilizer_p5n6_matrix_diag.g | tee /tmp/diag.log
