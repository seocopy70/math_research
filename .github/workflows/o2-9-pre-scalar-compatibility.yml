name: O2-9(pre) Scalar Compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/O2_9_pre_scalar_compatibility_2026-09-18.py'
      - '.github/workflows/o2-9-pre-scalar-compatibility.yml'
      - 'research/O2_7_deltaO_vs_U_representation_2026-09-18.py'
      - 'research/O2_8_factor_through_N_2026-09-18.py'
      - 'research/A3-4-10_CANONICAL_TAU_REVALIDATION_2026-09-16.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'

jobs:
  o2-9-pre:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Run O2-9(pre) scalar compatibility
        run: python research/O2_9_pre_scalar_compatibility_2026-09-18.py
      - name: Upload O2-9(pre) artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o2-9-pre-scalar-compatibility
          path: research/artifacts/o2_9_pre_scalar_compatibility.json
          if-no-files-found: warn
