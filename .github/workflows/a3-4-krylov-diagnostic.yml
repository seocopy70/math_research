name: A3-4 Krylov Rank Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/a3-4-krylov-diagnostic.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run diagnostic copy of BUILD_DATA
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('research/A3_4_BUILD_DATA_2026-09-17.py').read_text(encoding='utf-8')
          needle = 'assert rank3(Krylov) == 45'
          replacement = "print('KRYLOV_RANK =', rank3(Krylov))"
          if src.count(needle) != 1:
              raise RuntimeError(f'expected exactly one Krylov assertion, found {src.count(needle)}')
          diag = src.replace(needle, replacement, 1)
          stop = "assert Zcomm.shape[1] == 2"
          if diag.count(stop) != 1:
              raise RuntimeError(f'expected exactly one Zcomm dimension assertion, found {diag.count(stop)}')
          diag = diag.replace(stop, "print('ZCOMM_DIM =', Zcomm.shape[1])", 1)
          stop = "assert N is not None"
          if diag.count(stop) != 1:
              raise RuntimeError(f'expected exactly one N existence assertion, found {diag.count(stop)}')
          diag = diag.replace(stop, "print('N_FOUND =', N is not None); assert N is not None", 1)
          Path('/tmp/A3_4_BUILD_DATA_KRYLOV_DIAGNOSTIC.py').write_text(diag, encoding='utf-8')
          PY
          python /tmp/A3_4_BUILD_DATA_KRYLOV_DIAGNOSTIC.py
