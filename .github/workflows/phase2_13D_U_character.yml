name: Phase 2-13D U Torus Character

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/phase2_13D_U_torus_character_2026-09-16.py'
      - 'research/phase2_13B_positive_unipotent_2026-09-15.py'
      - '.github/workflows/phase2_13D_U_character.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python research/phase2_13D_U_torus_character_2026-09-16.py
