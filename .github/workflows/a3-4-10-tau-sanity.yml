name: A3-4-10 tau compatibility sanity

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/A3_4_10_TAU_COMPATIBILITY_SANITY_2026-09-17.py'
      - '.github/workflows/a3-4-10-tau-sanity.yml'

jobs:
  tau-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Run tau-specific sanity check
        run: PYTHONUNBUFFERED=1 python research/A3_4_10_TAU_COMPATIBILITY_SANITY_2026-09-17.py
