name: Build paper PDF

on:
  push:
    paths:
      - 'paper/**'
      - '.github/workflows/paper-build.yml'
  workflow_dispatch:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile manuscript
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: paper
          root_file: main.tex
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Verify PDF
        working-directory: paper
        run: |
          test -s main.pdf
          grep -q 'Output written on main.pdf' main.log
          grep -q '\\appendix' main.tex
          grep -q 'Detailed verification of the finite-depth calculation' main.tex
          grep -q 'Independent base-level enumeration' main.tex
          grep -q 'Cochain-level verification' main.tex
          grep -q 'Proof--computation boundary' main.tex
          ! grep -Eiq 'undefined|LaTeX Warning|Error:' main.log

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: finite-window-kummer-recognition-pdf
          path: paper/main.pdf
          if-no-files-found: error
