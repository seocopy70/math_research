name: Workflow shell pipeline audit

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'research/WORKFLOW_PIPELINE_AUDIT_2026-09-17.py'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'research/WORKFLOW_PIPELINE_AUDIT_2026-09-17.py'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit shell pipelines
        run: python research/WORKFLOW_PIPELINE_AUDIT_2026-09-17.py
      - name: Run Paper5 matrix diagnostic
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gap gap-autpgrp
          gap -q research/scripts/paper5_gl_stabilizer_p5n6_matrix_diag.g | tee /tmp/paper5-matrix-diag.log
