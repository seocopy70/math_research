name: Q3-5 pretest automatic transfer
on:
  workflow_dispatch:
jobs:
  pretest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python research/Q3_5_PRETEST_AUTO_TRANSFER_2026-09-17.py
