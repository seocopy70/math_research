name: A3-4-13.5 Delta_tau equivariance sanity

on:
  push:
    paths:
      - 'research/A3-4-13_5_EQUIVARIANCE_SANITY_2026-09-16.py'
      - 'research/phase2_23_A3_4_10_ambient_bracket_compatibility_2026-09-16.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - 'research/phase2_18_A3_4-5_intersection_K_and_Sym2_2026-09-16.py'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy
      - name: Run A3-4-13.5
        run: python research/A3-4-13_5_EQUIVARIANCE_SANITY_2026-09-16.py
