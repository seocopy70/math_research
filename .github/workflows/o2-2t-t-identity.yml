name: O2-2T T identity and global equivariance audit

on:
  push:
    paths:
      - 'research/O2-2T_T_IDENTITY_AND_GLOBAL_EQUIVARIANCE_2026-09-18.py'
      - 'research/O2-2R_OBSTRUCTION_EQUIVARIANCE_2026-09-18.py'
      - 'research/O2-2S_OBSTRUCTION_T_GROUP_CONSISTENCY_2026-09-18.py'
      - 'research/A3_4_10_BRACKET_PIPELINE_SANITY_2026-09-17.py'
      - '.github/workflows/o2-2t-t-identity.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Run O2-2T audit
        run: python research/O2-2T_T_IDENTITY_AND_GLOBAL_EQUIVARIANCE_2026-09-18.py
