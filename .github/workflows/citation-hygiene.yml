name: Citation hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  citation-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject citation artifacts and private-use characters
        shell: python
        run: |
          from pathlib import Path
          import re

          artifact_rx = re.compile(r"cite(?:turn\d+(?:search|news|file|view|academia)\d+)+")
          pua_rx = re.compile(r"[\uE000-\uF8FF]")
          bad_pua = []
          bad_artifact = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() in {".gz", ".tgz"} or path.name.endswith(".tar.gz"):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              if pua_rx.search(text):
                  bad_pua.append(str(path))
              if artifact_rx.search(text):
                  bad_artifact.append(str(path))

          if bad_pua or bad_artifact:
              if bad_pua:
                  print("Private-use Unicode characters found:")
                  print("\n".join(bad_pua))
              if bad_artifact:
                  print("Citation-artifact markers found:")
                  print("\n".join(bad_artifact))
              raise SystemExit(1)

          print("Citation hygiene PASS: no PUA characters or ChatGPT citation-artifact markers found.")
