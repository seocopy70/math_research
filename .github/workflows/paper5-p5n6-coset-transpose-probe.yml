name: Paper 5 p=5 coset transpose probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/scripts/paper5_p5n6_coset_transpose_probe.g'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gap gap-autpgrp
          gap -q research/scripts/paper5_p5n6_coset_transpose_probe.g > probe.log 2>&1 || true
          cat probe.log
