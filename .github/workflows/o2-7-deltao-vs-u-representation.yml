name: O2-7 DeltaO vs U Representation

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/O2_7_deltaO_vs_U_representation_2026-09-18.py'
      - '.github/workflows/o2-7-deltao-vs-u-representation.yml'
      - 'research/A3-4-10_CANONICAL_TAU_REVALIDATION_2026-09-16.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'

jobs:
  o2-7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numpy
        run: python -m pip install numpy

      - name: Run O2-7 representation-aware comparison
        run: python research/O2_7_deltaO_vs_U_representation_2026-09-18.py

      - name: Upload O2-7 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o2-7-deltaO-vs-U
          path: research/artifacts/o2_7_deltaO_vs_U.json
          if-no-files-found: warn
