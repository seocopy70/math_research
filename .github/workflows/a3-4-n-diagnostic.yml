name: A3-4 N Reconstruction Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/A3_4_N_RECON_DIAGNOSTIC_2026-09-17.py'
      - '.github/workflows/a3-4-n-diagnostic.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Print commit SHA
        run: echo "DIAGNOSTIC GITHUB_SHA=${GITHUB_SHA}"
      - name: Run independent N reconstruction diagnostic
        run: python research/A3_4_N_RECON_DIAGNOSTIC_2026-09-17.py
