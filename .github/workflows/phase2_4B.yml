name: Phase 2-4B — middle quotient M=ker(N)/im(N)

on:
  workflow_dispatch:

jobs:
  analyze-middle-quotient:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Run Phase 2-4B
        run: python research/phase2_4B_middle_quotient_2026-09-15.py | tee phase2_4B_result.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: phase2-4B-result
          path: phase2_4B_result.txt
