name: A3-4-B Intrinsic Reconstruction

on:
  push:
    paths:
      - 'research/A3-4-B_INTRINSIC_RECONSTRUCTION_2026-09-17.py'
      - 'research/phase2_18_A3_4_5_intersection_K_and_Sym2_2026-09-16.py'
      - '.github/workflows/a3-4-b-intrinsic-reconstruction.yml'
  workflow_dispatch:

jobs:
  intrinsic-reconstruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy sympy
      - name: Run A3-4-B scaffold
        run: python research/A3-4-B_INTRINSIC_RECONSTRUCTION_2026-09-17.py
