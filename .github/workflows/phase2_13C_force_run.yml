name: Phase 2-13C Force Sanity Check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/phase2_13C_force_run.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python research/phase2_13C_sanity_check_2026-09-16.py
