name: Phase 2-6 A — U vs L(2,0)

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/phase2_6_A_U_vs_sym2_2026-09-15.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'
      - '.github/workflows/phase2_6_A.yml'

permissions:
  contents: read

jobs:
  verify-A:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install numerical dependency
        run: python -m pip install --upgrade pip numpy

      - name: Run Phase 2-6 A verification
        run: |
          mkdir -p artifacts/phase2_6_A
          python research/phase2_6_A_U_vs_sym2_2026-09-15.py | tee artifacts/phase2_6_A/result.txt

      - name: Publish result summary
        if: always()
        run: |
          {
            echo '# Phase 2-6 A verification result'
            echo
            echo 'Commit: $GITHUB_SHA'
            echo
            echo '```text'
            cat artifacts/phase2_6_A/result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload numerical certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-6-A-result-${{ github.sha }}
          path: artifacts/phase2_6_A/result.txt
          if-no-files-found: error
