name: Paper 5 p=3 embedded stabilizer and intrinsic line gate
on:
  push:
    branches: [main]
    paths:
      - 'research/scripts/paper5_p3_stabilizer_gate.g'
      - '.github/workflows/paper5-p3-stabilizer-gate.yml'
jobs:
  stabilizer-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GAP and AutPGrp
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gap gap-autpgrp
      - name: Run p=3 stabilizer gate
        run: |
          set -euo pipefail
          gap -q research/scripts/paper5_p3_stabilizer_gate.g > paper5_p3_stabilizer_runtime.log 2>&1
          cat paper5_p3_stabilizer_runtime.log
          grep -Fq 'P5_P3_STABILIZER_CASE s=1 a=1 PASS' paper5_p3_stabilizer_runtime.log
          grep -Fq 'P5_P3_STABILIZER_IMAGE_ORDER=6' paper5_p3_stabilizer_runtime.log
          grep -Fq 'P5_P3_STABILIZER_INTRINSIC_LINE=PASS' paper5_p3_stabilizer_runtime.log
          grep -Fq 'P5_P3_STABILIZER_CERTIFICATE=PASS' paper5_p3_stabilizer_runtime.log
