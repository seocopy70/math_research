name: Phase 2-15 A3-4-2 X2 q-sensitivity

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/phase2_15_A3_4_2_X2_q_sensitivity_2026-09-16.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - '.github/workflows/phase2-15_A3-4-2.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Run A3-4-2 certificate
        run: python research/phase2_15_A3_4_2_X2_q_sensitivity_2026-09-16.py
