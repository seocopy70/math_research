name: Rank-4 D4 lift-independence audit

on:
  workflow_dispatch:
  push:
    paths:
      - research/rank4_D4_lift_independence_audit_2026-09-19.py
      - .github/workflows/rank4-d4-lift-independence-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/rank4_D4_lift_independence_audit_2026-09-19.py