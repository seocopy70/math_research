name: Phase 2-15 q3 vs q9 degree4 control

on:
  push:
    paths:
      - 'research/phase2_15_q3_vs_q9_degree4_control_2026-09-16.py'
      - '.github/workflows/phase2_15_q3_vs_q9.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/phase2_15_q3_vs_q9_degree4_control_2026-09-16.py
