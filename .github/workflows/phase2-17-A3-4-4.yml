name: Phase 2-17 A3-4-4 Orbit Module

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - 'research/phase2_17_A3_4_4_X1_power_X2_orbit_module_2026-09-16.py'
      - '.github/workflows/phase2-17-A3-4-4.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Run A3-4-4 orbit-module certificate
        run: python research/phase2_17_A3_4_4_X1_power_X2_orbit_module_2026-09-16.py
