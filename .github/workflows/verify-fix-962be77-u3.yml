name: verify-fix-962be77-u3
on:
  push:
    branches: [fix/962be77-u3-latex]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra poppler-utils
      - name: Build and audit
        working-directory: paper
        run: |
          set -euxo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error main.tex 2>&1 | tee build1.log
          pdflatex -interaction=nonstopmode -halt-on-error main.tex 2>&1 | tee build2.log
          pdflatex -interaction=nonstopmode -halt-on-error main.tex 2>&1 | tee build3.log
          test -s main.pdf
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PAGES=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
          grep -Eni 'Undefined|LaTeX Warning|LaTeX Error|Fatal error|Emergency stop|! ' build3.log && exit 1 || true
          echo "SHA256:"; sha256sum main.tex main.pdf
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fixed-u3-pdf
          path: |
            paper/main.pdf
            paper/build1.log
            paper/build2.log
            paper/build3.log
