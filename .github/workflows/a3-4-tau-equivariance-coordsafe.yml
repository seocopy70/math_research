name: A3-4 tau H-equivariance coordinate-safe

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/A3-4-TAU_H_EQUIVARIANCE_COORDSAFE_2026-09-16.py'
      - '.github/workflows/a3-4-tau-equivariance-coordsafe.yml'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Run coordinate-safe tau equivariance check
        run: python research/A3-4-TAU_H_EQUIVARIANCE_COORDSAFE_2026-09-16.py
