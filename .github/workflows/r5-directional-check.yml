name: R5 directional injectivity check

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Run directional R5 check
        run: python research/RELATION_R5_DIRECTIONAL_INJECTIVITY_2026-09-16.py
