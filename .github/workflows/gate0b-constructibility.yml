name: Gate 0-B q3 qinf A3-4 constructibility

on:
  push:
    paths:
      - 'research/GATE0B_Q3_QINF_BA_CONSTRUCTIBILITY_2026-09-17.py'
      - 'research/GATE0B_Q3_QINF_BA_CONSTRUCTIBILITY_DESIGN_2026-09-17.md'
      - '.github/workflows/gate0b-constructibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate0b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run Gate 0-B constructibility test
        shell: bash
        run: |
          set -euo pipefail
          python research/GATE0B_Q3_QINF_BA_CONSTRUCTIBILITY_2026-09-17.py
