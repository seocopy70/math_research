name: Phase 2-20 A3-4-7 T orbit

on:
  push:
    paths:
      - 'research/phase2_20_A3_4_7_multidegree_T_orbit_2026-09-16.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - '.github/workflows/phase2-20-A3-4-7.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Run A3-4-7 verification
        run: python research/phase2_20_A3_4_7_multidegree_T_orbit_2026-09-16.py
