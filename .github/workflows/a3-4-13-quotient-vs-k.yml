name: A3-4-13 quotient B over A vs K

on:
  push:
    paths:
      - 'research/A3-4-13_QUOTIENT_B_OVER_A_VS_K_2026-09-16.py'
      - 'research/A3-4-12_IMAGE_INTERSECTION_DELTA_U_DELTA_TAU_2026-09-16.py'
      - 'research/phase2_23_A3_4_10_ambient_bracket_compatibility_2026-09-16.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'
      - 'research/phase2_18_A3_4_5_intersection_K_and_Sym2_2026-09-16.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy
      - name: Run A3-4-13
        run: python research/A3-4-13_QUOTIENT_B_OVER_A_VS_K_2026-09-16.py
