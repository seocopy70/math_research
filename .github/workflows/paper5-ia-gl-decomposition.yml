name: Paper 5 IA/GL decomposition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/scripts/paper5_ia_gl_decomposition.g'
      - '.github/workflows/paper5-ia-gl-decomposition.yml'

jobs:
  gap-ia-gl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GAP and AutPGrp
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-autpgrp
      - name: Run Paper 5 IA/GL decomposition
        run: |
          gap -q research/scripts/paper5_ia_gl_decomposition.g > paper5_ia_gl_runtime.log 2>&1
          cat paper5_ia_gl_runtime.log
      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper5-ia-gl-runtime
          path: paper5_ia_gl_runtime.log
