name: rank4-d4-ia-extension-audit

on:
  push:
    paths:
      - "research/rank4_D4_ia_extension_audit_2026-09-19.py"
      - ".github/workflows/rank4-d4-ia-extension-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run IA defect-action audit
        run: python research/rank4_D4_ia_extension_audit_2026-09-19.py
