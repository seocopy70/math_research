name: Gate 0-A common W45 direct verification

on:
  push:
    branches: [main]
    paths:
      - 'research/GATE0A_Q3_QINF_COMMON_W45_2026-09-17.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - '.github/workflows/gate0a-common-w45.yml'
  workflow_dispatch:

jobs:
  gate0a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numeric dependency
        run: python -m pip install numpy

      - name: Run Gate 0-A
        run: python research/GATE0A_Q3_QINF_COMMON_W45_2026-09-17.py
