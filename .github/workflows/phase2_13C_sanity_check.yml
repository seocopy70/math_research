name: Phase 2-13C Torus Character Sanity Check

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/phase2_13C_sanity_check_2026-09-16.py'
      - 'research/phase2_13C_torus_character_2026-09-16.py'
      - '.github/workflows/phase2_13C_sanity_check.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      # Exhaustive character classification is part of the hard audit.
      - run: python research/phase2_13C_sanity_check_2026-09-16.py
