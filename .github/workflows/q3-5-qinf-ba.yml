name: Q3-5 qinf independent BA
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Run Q3-5
        run: python research/Q3_5_QINF_BA_INDEPENDENT_2026-09-17.py
