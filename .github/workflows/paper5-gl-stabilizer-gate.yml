name: Paper 5 GL stabilizer equality gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/scripts/paper5_gl_stabilizer_gate.g'
      - '.github/workflows/paper5-gl-stabilizer-gate.yml'
jobs:
  gl-stabilizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GAP and AutPGrp
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gap gap-autpgrp
      - name: Run stabilizer equality gate
        run: |
          set -euo pipefail
          gap -q research/scripts/paper5_gl_stabilizer_gate.g | tee paper5_gl_stabilizer_runtime.log
          grep -q 'embedded equality in basis (x,y,z) = true' paper5_gl_stabilizer_runtime.log
