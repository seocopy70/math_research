name: O2-3 U vs obstruction

on:
  push:
    paths:
      - 'research/O2_3_U_vs_obstruction_2026-09-18.py'
      - 'research/phase2_23_A3_4_10_ambient_bracket_compatibility_2026-09-16.py'
      - 'research/A3_4_10_BRACKET_PIPELINE_SANITY_2026-09-17.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - '.github/workflows/o2-3-u-vs-obstruction.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Run O2-3 verification
        run: python research/O2_3_U_vs_obstruction_2026-09-18.py
