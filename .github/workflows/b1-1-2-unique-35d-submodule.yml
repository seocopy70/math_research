name: B1-1-2 unique 35D submodule

on:
  push:
    branches: [main]
    paths:
      - 'research/B1-1-2_UNIQUE_35D_SUBMODULE_2026-09-17.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'
      - '.github/workflows/b1-1-2-unique-35d-submodule.yml'
  workflow_dispatch:

jobs:
  b1-1-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install numpy sympy
      - name: Install GAP
        run: sudo apt-get update && sudo apt-get install -y gap
      - name: Verify GAP MeatAxe interface
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/gap_probe.g <<'EOF'
          F := GF(3);;
          A := IdentityMat(1,F);;
          M := GModuleByMats([A],F);;
          Print(MTX.IsIrreducible(M), "\n");;
          QUIT;
          EOF
          gap -q < /tmp/gap_probe.g | tee /tmp/gap_probe.out
          grep -Fx 'true' /tmp/gap_probe.out
      - name: Run B1-1-2
        shell: bash
        run: |
          set -euo pipefail
          python research/B1-1-2_UNIQUE_35D_SUBMODULE_2026-09-17.py
