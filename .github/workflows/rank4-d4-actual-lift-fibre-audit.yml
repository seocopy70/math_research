name: rank4-d4-actual-lift-fibre-audit
on:
  push:
    branches: [main]
    paths:
      - 'research/rank4_D4_actual_lift_fibre_audit_2026-09-19.py'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact F3 audit
        run: python research/rank4_D4_actual_lift_fibre_audit_2026-09-19.py
