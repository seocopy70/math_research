name: Phase 2-14 F9 algebraic extension v3
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/phase2_14_F9_algebraic_extension_v3_2026-09-16.py'
      - 'research/phase2_14_F9_minor_diagnostic_2026-09-16.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'
      - '.github/workflows/phase2_14_F9_v3.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: F9 field sanity check
        run: |
          python - <<'PY'
          from itertools import product
          F9=[(a,b) for a in range(3) for b in range(3)]
          def add(x,y): return ((x[0]+y[0])%3,(x[1]+y[1])%3)
          def mul(x,y): return ((x[0]*y[0]+2*x[1]*y[1])%3,(x[0]*y[1]+x[1]*y[0])%3)
          def inv(x):
              d=(x[0]*x[0]+x[1]*x[1])%3; di=1 if d==1 else 2
              return ((x[0]*di)%3,(-x[1]*di)%3)
          def pow9(x,n):
              r=(1,0)
              while n:
                  if n&1: r=mul(r,x)
                  x=mul(x,x); n//=2
              return r
          star=[x for x in F9 if x!=(0,0)]
          emb=lambda a:(a%3,0)
          assert len(F9)==9 and len(star)==8
          assert all(pow9(x,8)==(1,0) and mul(x,inv(x))==(1,0) for x in star)
          assert all(mul(emb(a),emb(b))==emb((a*b)%3) for a,b in product(range(3),repeat=2))
          assert all(add(emb(a),emb(b))==emb((a+b)%3) for a,b in product(range(3),repeat=2))
          assert add(add(emb(1),emb(1)),emb(1))==(0,0)
          print('F9 FIELD SANITY PASSED: field order 9, |F9*|=8, characteristic 3, F3 inclusion compatible.')
          PY
      - name: Diagnose F9 scalar-extension minor
        run: python research/phase2_14_F9_minor_diagnostic_2026-09-16.py
      - name: Patch runtime F9 coercion defensively
        run: |
          python - <<'PY'
          p='research/phase2_14_F9_algebraic_extension_v3_2026-09-16.py'
          s=open(p,encoding='utf-8').read()
          old="def add(x,y): return ((x[0]+y[0])%3,(x[1]+y[1])%3)"
          new="def _f9(x):\n    if isinstance(x,tuple): return (int(x[0])%3,int(x[1])%3)\n    if isinstance(x,np.ndarray):\n        if x.ndim==0: return _f9(x.item())\n        if x.shape==(2,): return (int(x[0])%3,int(x[1])%3)\n    return (int(x)%3,0)\ndef add(x,y):\n    x=_f9(x); y=_f9(y); return ((x[0]+y[0])%3,(x[1]+y[1])%3)"
          assert old in s
          s=s.replace(old,new)
          old="def mul(x,y): return ((x[0]*y[0]+2*x[1]*y[1])%3,(x[0]*y[1]+x[1]*y[0])%3)"
          new="def mul(x,y):\n    x=_f9(x); y=_f9(y); return ((x[0]*y[0]+2*x[1]*y[1])%3,(x[0]*y[1]+x[1]*y[0])%3)"
          assert old in s
          s=s.replace(old,new)
          old="def neg(x): return ((-x[0])%3,(-x[1])%3)"
          new="def neg(x):\n    x=_f9(x); return ((-x[0])%3,(-x[1])%3)"
          assert old in s
          s=s.replace(old,new)
          old="def zero(x): return x==(0,0)"
          new="def zero(x): return _f9(x)==(0,0)"
          assert old in s
          s=s.replace(old,new)
          open(p,'w',encoding='utf-8').write(s)
          print('RUNTIME F9 COERCION PATCH APPLIED')
          PY
      - name: Run Phase 2-14 v3
        run: python research/phase2_14_F9_algebraic_extension_v3_2026-09-16.py
      - run: echo "phase2-14-v3-trigger=5"