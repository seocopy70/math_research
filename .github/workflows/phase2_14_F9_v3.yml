name: Phase 2-14 F9 algebraic extension v3
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/phase2_14_F9_algebraic_extension_v3_2026-09-16.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'
      - '.github/workflows/phase2_14_F9_v3.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: |
          python - <<'PY'
          p='research/phase2_14_F9_algebraic_extension_v3_2026-09-16.py'
          s=open(p,encoding='utf-8').read()
          s=s.replace("def ext(A): return np.array([[(int(x)%3,0) for x in row] for row in np.asarray(A)],dtype=object)", "def ext(A): return np.frompyfunc(lambda x:(int(x)%3,0),1,1)(np.asarray(A))")
          s=s.replace("Rcols=[np.array([(int(x)%3,0) for x in col],dtype=object) for col in R4_ind.T]", "Rcols=[np.frompyfunc(lambda x:(int(x)%3,0),1,1)(col) for col in R4_ind.T]")
          open(p,'w',encoding='utf-8').write(s)
          PY
      - run: python research/phase2_14_F9_algebraic_extension_v3_2026-09-16.py
      - run: echo "phase2-14-v3-trigger=2"