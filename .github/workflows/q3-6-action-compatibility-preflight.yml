name: Q3-6 Action Compatibility Preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python research/Q3_6_ACTION_COMPATIBILITY_PREFLIGHT_2026-09-17.py
