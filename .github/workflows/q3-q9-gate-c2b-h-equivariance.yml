name: Q3/Q9 Gate C-2b restricted-power H-equivariance

on:
  workflow_dispatch:
  push:
    paths:
      - research/Q3_Q9_GATE_C2b_H_equivariance_2026-09-19.py
      - .github/workflows/q3-q9-gate-c2b-h-equivariance.yml

jobs:
  gate-c2b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run C-2b
        run: python research/Q3_Q9_GATE_C2b_H_equivariance_2026-09-19.py
