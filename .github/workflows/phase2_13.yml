name: Phase 2-13 Direct Structural Probe E

on:
  push:
    paths:
      - 'research/phase2_13_E_highest_weight_2026-09-15.py'
      - 'research/PHASE2_13_TRIGGER_2026-09-15.md'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'
      - '.github/workflows/phase2_13.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Run Phase 2-13
        run: python research/phase2_13_E_highest_weight_2026-09-15.py
