name: Phase 2-14 A3-3 degree-4 correction

on:
  push:
    paths:
      - 'research/phase2_14_A3_3_degree4_correction_2026-09-16.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - '.github/workflows/phase2-14_A3-3.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python research/phase2_14_A3_3_degree4_correction_2026-09-16.py
