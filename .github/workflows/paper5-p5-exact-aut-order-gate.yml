name: Paper 5 exact p=5 Aut W6 order gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/scripts/paper5_p5_exact_aut_order_gate.g'
      - '.github/workflows/paper5-p5-exact-aut-order-gate.yml'
jobs:
  aut-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GAP and AutPGrp
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gap gap-autpgrp
      - name: Run exact p=5 Aut(W6) order gate
        run: |
          set -euo pipefail
          gap -q research/scripts/paper5_p5_exact_aut_order_gate.g > paper5_p5_exact_aut_order.log 2>&1
          cat paper5_p5_exact_aut_order.log
          grep -Fq 'p=5 n=6 s=0 a=1 |W|=5^47 |Aut|=[ [ 2, 4 ], [ 5, 109 ] ]' paper5_p5_exact_aut_order.log
          grep -Fq 'p=5 n=6 s=1 a=1 |W|=5^47 |Aut|=[ [ 2, 2 ], [ 5, 107 ] ]' paper5_p5_exact_aut_order.log
          grep -Fq 'p=5 n=6 s=2 a=1 |W|=5^47 |Aut|=[ [ 2, 4 ], [ 5, 109 ] ]' paper5_p5_exact_aut_order.log
          grep -Fq 'p=5 n=6 s=1 a=2 |W|=5^47 |Aut|=[ [ 2, 5 ], [ 3, 1 ], [ 5, 107 ] ]' paper5_p5_exact_aut_order.log
          grep -Fq 'p=5 n=6 s=0 a=2 |W|=5^47 |Aut|=[ [ 2, 7 ], [ 3, 1 ], [ 5, 109 ] ]' paper5_p5_exact_aut_order.log
