name: R5 sanity check

on:
  push:
    paths:
      - 'research/RELATION_R5_SANITY_CHECK_2026-09-16.py'
      - '.github/workflows/r5-sanity-check.yml'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Run independent R5 sanity check
        run: python research/RELATION_R5_SANITY_CHECK_2026-09-16.py
