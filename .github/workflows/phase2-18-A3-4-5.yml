name: Phase 2-18 A3-4-5 Intersection Module Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'
      - 'research/phase2_18_A3_4_5_intersection_K_and_Sym2_2026-09-16.py'
      - '.github/workflows/phase2-18-A3-4-5.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Run A3-4-5 module identification certificate
        run: python research/phase2_18_A3_4_5_intersection_K_and_Sym2_2026-09-16.py
