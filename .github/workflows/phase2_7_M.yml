name: Phase 2-7 M quotient verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/phase2_7_M_quotient_2026-09-15.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'
      - '.github/workflows/phase2_7_M.yml'

jobs:
  verify-M:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --upgrade pip numpy
      - name: Run Phase 2-7 M verification
        run: |
          mkdir -p artifacts/phase2_7_M
          python research/phase2_7_M_quotient_2026-09-15.py | tee artifacts/phase2_7_M/result.txt
      - name: Publish result summary
        run: |
          {
            echo '# Phase 2-7 M quotient verification'
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo '```text'
            cat artifacts/phase2_7_M/result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload numerical certificate
        uses: actions/upload-artifact@v4
        with:
          name: phase2-7-M-result-${{ github.sha }}
          path: artifacts/phase2_7_M/result.txt
