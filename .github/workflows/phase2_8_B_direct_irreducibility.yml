name: Phase 2-8B direct irreducibility verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/phase2_7_M_quotient_2026-09-15.py'
      - 'research/phase2_8_B_direct_irreducibility_2026-09-15.py'
      - '.github/workflows/phase2_8_B_direct_irreducibility.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run direct irreducibility certificate
        run: python research/phase2_8_B_direct_irreducibility_2026-09-15.py
