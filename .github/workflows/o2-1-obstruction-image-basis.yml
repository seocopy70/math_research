name: O2-1 obstruction image basis

on:
  push:
    paths:
      - 'research/O2-1_OBSTRUCTION_IMAGE_BASIS_2026-09-18.py'
      - 'research/O1-1_QUOTIENT_FACTORIZATION_2026-09-18.py'
      - 'research/O1-0_OBSTRUCTION_ANNIHILATES_I_2026-09-18.py'
      - 'research/phase2_3_endH_optimized_2026-09-15.py'
      - 'research/phase2_23_A3_4_10_ambient_bracket_compatibility_2026-09-16.py'
      - 'research/A3_4_10_BRACKET_PIPELINE_SANITY_2026-09-17.py'
      - '.github/workflows/o2-1-obstruction-image-basis.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Run O2-1 obstruction image basis test
        run: python research/O2-1_OBSTRUCTION_IMAGE_BASIS_2026-09-18.py
