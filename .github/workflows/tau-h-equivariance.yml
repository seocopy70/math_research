name: tau H-equivariance verification

on:
  push:
    paths:
      - 'research/A3-4-TAU_H_EQUIVARIANCE_TRUE_Wd_2026-09-16.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - '.github/workflows/tau-h-equivariance.yml'
  workflow_dispatch:

jobs:
  verify-tau-h-equivariance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python research/A3-4-TAU_H_EQUIVARIANCE_TRUE_Wd_2026-09-16.py
