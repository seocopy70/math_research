name: A3-4 W_d true-relation revalidation

on:
  push:
    paths:
      - 'research/A3-4-REVALIDATION_Wd_TRUE_RELATION_2026-09-16.py'
      - 'research/phase2_1_invariant_space_verification_2026-09-15.py'
      - '.github/workflows/a3-4-wd-true-relation.yml'
  workflow_dispatch:

jobs:
  verify-wd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Run W_d true-relation gate
        run: python research/A3-4-REVALIDATION_Wd_TRUE_RELATION_2026-09-16.py
